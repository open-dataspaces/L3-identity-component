# クライアント情報更新 -------------------------------------------------------
put:
  tags:
    - auth/clients
  summary: クライアント情報更新API
  description: |-
    クライアント情報を更新します。  
    指定した任意項目の値を更新します。  

    クライアントシステム認証用と認可コードフロー用の2種類に対応しています。  
    認証フローが更新前と一致しない場合、属性情報の再登録のため現在登録されている属性情報は削除されます。  
    リクエストヘッダーに設定されたアクセストークンに紐づく権限により、更新操作が制限されます。  
    操作権限が不足している場合は、認可タプル登録APIで権限を追加してください。  
    認可モデルの追加が必要な場合は認可モデル登録APIを利用してください。  
    クライアントシークレットは更新されないため再発行されません、クライアントID発行時のクライアントシークレットを引き続き利用できます。    
    クライアントID発行APIで発行されたクライアントのみ更新できます。  
    クライアントID発行APIで発行されていないクライアントIDを指定した場合はエラーとなります。  

    - 操作権限が不足している場合、HTTPステータスコード 403 Forbidden を返却します。

    クライアントシステム認証用
    - 使用するモデル : clientUpdateInputModel
    - 取得されるモデル : clientOutputModel

    認可コードフロー用
    - 使用するモデル : authUpdateInputModel
    - 取得されるモデル : authOutputModel

  parameters:
    - name: client_id
      in: path
      required: true
      description: |-
        クライアントID
        - 更新を行うIDPのクライアントIDを指定します。
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]+$'
        minLength: 1
        maxLength: 239
        example: "abc123xyz"   
    # Header Parameter
    - $ref: '../../components/headers/request.yaml#/requestHeaders/Content-Type'
    - $ref: '../../components/headers/request.yaml#/requestHeaders/User-Agent'
    - $ref: '../../components/headers/request.yaml#/requestHeaders/Accept-Language'
    - $ref: '../../components/headers/request.yaml#/requestHeaders/X-TrackingID'
  security:
    - API-Key: []
      Authorization: []
  x-codegen-request-body-name: RequestBody

  requestBody:
    description: リクエスト情報
    content:
      application/json:
        schema:
          oneOf:
            - $ref: "../../components/schemas/clients/clientUpdateInputModel.yaml#/clientUpdateInputModel"
            - $ref: "../../components/schemas/clients/authUpdateInputModel.yaml#/authUpdateInputModel"

  responses:
    "200":
      description: |-
        クライアント情報の更新に成功しました。  
        クライアント情報を返却します。
      headers:
        Content-Security-Policy:
          $ref: "../../components/headers/responses.yaml#/responseHeaders/Content-Security-Policy"
        X-Content-Type-Options:
          $ref: "../../components/headers/responses.yaml#/responseHeaders/X-Content-Type-Options"
        Strict-Transport-Security:
          $ref: "../../components/headers/responses.yaml#/responseHeaders/Strict-Transport-Security"
        X-TrackingID:
          $ref: "../../components/headers/request.yaml#/requestHeaders/X-TrackingID"
        Access-Control-Allow-Origin:
          $ref: "../../components/headers/responses.yaml#/responseHeaders/Access-Control-Allow-Origin"
        Access-Control-Allow-Methods:
          $ref: "../../components/headers/responses.yaml#/responseHeaders/Access-Control-Allow-Methods"
        Access-Control-Allow-Headers:
          $ref: "../../components/headers/responses.yaml#/responseHeaders/Access-Control-Allow-Headers"
        Access-Control-Allow-Credentials:
          $ref: "../../components/headers/responses.yaml#/responseHeaders/Access-Control-Allow-Credentials"
      content:
        application/json:
          schema:
            oneOf:
              - allOf:
                  - $ref: '../../components/schemas/common/httpResponses.yaml#/httpResponses'
                  - $ref: '../../components/schemas/clients/updateOutputModel.yaml#/clientOutputModel'
              - allOf:
                  - $ref: '../../components/schemas/common/httpResponses.yaml#/httpResponses'
                  - $ref: '../../components/schemas/clients/updateOutputModel.yaml#/authOutputModel'
    "400":
      $ref: '../../components/schemas/common/httpError.yaml#/responses/400'
    "401":
      $ref: '../../components/schemas/common/httpError.yaml#/responses/401'
    "403":
      $ref: '../../components/schemas/common/httpError.yaml#/responses/403'
    "404":
      $ref: '../../components/schemas/common/httpError.yaml#/responses/404'
    "415":
      $ref: '../../components/schemas/common/httpError.yaml#/responses/415'
    "500":
      $ref: '../../components/schemas/common/httpError.yaml#/responses/500'
    "503":
      $ref: '../../components/schemas/common/httpError.yaml#/responses/503'

# クライアントID削除 -------------------------------------------------------
delete:
  tags:
  - auth/clients
  summary: クライアントID削除API
  description: |-
    クライアントIDを削除します。  
    削除されたクライアントIDは復元できませんのでご注意ください。  
    リクエストヘッダーに設定されたアクセストークンに紐づく権限により、削除操作が制限されます。  
    操作権限が不足している場合は、認可タプル登録APIで権限を追加してください。  
    認可モデルの追加が必要な場合は認可モデル登録APIを利用してください。   
        クライアントID発行APIで発行されたクライアントのみ削除できます。  
    クライアントID発行APIで発行されていないクライアントIDを指定した場合はエラーとなります。  
    
    - 操作権限が不足している場合、HTTPステータスコード 403 Forbidden を返却します。

  parameters:
    - name: client_id
      in: path
      required: true
      description: |-
        クライアントID
        - 削除を行うIDPのクライアントIDを指定します。
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]+$'
        minLength: 1
        maxLength: 239
        example: "abc123xyz"    

    - $ref: '../../components/headers/request.yaml#/requestHeaders/Content-Type'
    - $ref: '../../components/headers/request.yaml#/requestHeaders/User-Agent'
    - $ref: '../../components/headers/request.yaml#/requestHeaders/Accept-Language'
    - $ref: '../../components/headers/request.yaml#/requestHeaders/X-TrackingID'

  security:
  - API-Key: []
    Authorization: []
  x-codegen-request-body-name: RequestBody

  # リクエストボディなし
  responses:
    "204":
      description: |-
        クライアントの削除に成功しました。  
      headers:
        Content-Security-Policy:
          $ref: "../../components/headers/responses.yaml#/responseHeaders/Content-Security-Policy"
        X-Content-Type-Options:
          $ref: "../../components/headers/responses.yaml#/responseHeaders/X-Content-Type-Options"
        Strict-Transport-Security:
          $ref: "../../components/headers/responses.yaml#/responseHeaders/Strict-Transport-Security"
        X-TrackingID:
          $ref: "../../components/headers/request.yaml#/requestHeaders/X-TrackingID"
        Access-Control-Allow-Origin:
          $ref: "../../components/headers/responses.yaml#/responseHeaders/Access-Control-Allow-Origin"
        Access-Control-Allow-Methods:
          $ref: "../../components/headers/responses.yaml#/responseHeaders/Access-Control-Allow-Methods"
        Access-Control-Allow-Headers:
          $ref: "../../components/headers/responses.yaml#/responseHeaders/Access-Control-Allow-Headers"
        Access-Control-Allow-Credentials:
          $ref: "../../components/headers/responses.yaml#/responseHeaders/Access-Control-Allow-Credentials"
    "400":
      $ref: '../../components/schemas/common/httpError.yaml#/responses/400'
    "401":
      $ref: '../../components/schemas/common/httpError.yaml#/responses/401'
    "403":
      $ref: '../../components/schemas/common/httpError.yaml#/responses/403'
    "404":
      $ref: '../../components/schemas/common/httpError.yaml#/responses/404'
    "500":
      $ref: '../../components/schemas/common/httpError.yaml#/responses/500'
    "503":
      $ref: '../../components/schemas/common/httpError.yaml#/responses/503'
