plantListInputModel:
  type: object
  required:
    - count
    - index
  description: |-
    属性（事業所）情報一覧取得API
    の Request Body
  properties:
    # 取得件数制御 --------------------------------
    count:
      type: integer
      format: int32
      minimum: 0
      description: |-
        データ取得件数
        - データベース内で一致する属性（事業所）情報の最大取得件数を指定します
        - すべての検索結果を取得する場合は 0 を指定してください
      example: 0

    index:
      type: integer
      format: int32
      minimum: 0
      description: |-
        データ取得開始位置
        - データベース内で一致する属性（事業所）情報の取得開始位置を指定します
      example: 0

    sort:
      type: object
      description: |-
        ソート条件

      properties:
        key:
          type: string
          enum:
            - "operator_id"
            - "plant_id"
            - "open_plant_id"
            - "global_plant_id"
            - "plant_name"
            - "plant_address"
            - "effective_start_date"
            - "effective_end_date"
            - "deleted_flag"
            - "created_at"
            - "updated_at"
          default: "plant_id"
          description: |-
            ソートキー
            - データベース内で一致する属性（事業所）情報の取得結果をソートキーを指定します
            - 指定しない場合、ソートキーは plant_id になります
          example: "plant_id"

        order:
          type: string
          enum: ["asc", "desc"]
          default: "asc"
          description: |-
            ソート条件
            - データベース内で一致する属性（事業所）情報の取得結果ソート順を指定します
            - asc : 昇順
            - desc : 降順
          example: "asc"

    # IDPアカウント関連 -----------------------------
    operator_id:
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      description: |-
        事業者識別子（内部）
        - 事業者を一意に識別するための識別子です。
      example: "d9a38406-cae2-4679-b052-15a75f5531e6"

    # 事業所情報関連 -----------------------------
    plant_id:
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      description: |-
        事業所識別子（内部）
        - 事業所を一意に識別する識別子です。
      example: "d9a38406-cae2-4679-b052-15a75f5531e6"

    open_plant_id:
      type: string
      minLength: 6
      maxLength: 26
      pattern: '[0-9]{6}$'
      description: |-
        事業所識別子（ローカル）
      example: "9876543210987123456"

    global_plant_id:
      type: string
      minLength: 0
      maxLength: 256
      nullable: true
      description: |-
        事業所識別子（グローバル）
      example: "sampleId1"

    plant_name:
      type: string
      minLength: 1
      maxLength: 256
      description: |-
        事業所名
        - 文字コード：UTF-8
        - 半角、全角文字どちらも許容します。
        - あいまい検索を行う場合、ワイルドカードは '*' を指定してください。 
      example: "テスト株式会社"

    plant_address:
      type: string
      minLength: 1
      maxLength: 256
      description: |-
        事業所在地
        - 文字コード：UTF-8
        - 半角、全角文字どちらも許容します。
        - あいまい検索を行う場合、ワイルドカードは '*' を指定してください。 
      example: "試験県テスト市examビル1F"

    # ステータス制御関連 -----------------------------
    effective_date:
      type: string
      format: date
      description: |-
        属性（事業所）情報の有効日
        - YYYY-MM-DD形式で指定してください。
        - 指定しない場合は、有効開始日および有効終了日を検索条件に含みません。
      example: "2025-01-01"

    deleted_flag:
      type: boolean
      description: |-
        無効化フラグ
        - 指定しない場合は、無効化フラグを検索条件に含めません。

