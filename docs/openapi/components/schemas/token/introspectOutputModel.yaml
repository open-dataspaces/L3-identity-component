introspectOutputModel:
  type: object
  description: |-
    トークンイントロスペクション情報モデル
    - アクセストークンの有効状態
    - アクセストークンの詳細情報
  title: introspectOutputModel
  required:
  - data
  properties:
    data:
      type: object
      description: |-
        APIの実行結果のデータオブジェクト
      oneOf:
        # アクセストークンが有効な場合のデータオブジェクト
        # active=true
        - title: activeTokenIntrospectionProperties
          type: object
          required:
          - active
          - token_info
          description: |-
            アクセストークンが有効な場合のデータオブジェクト
            - トークンが有効な場合、トークンの詳細情報を返却します。
          properties:
            active:
              const: true
              type: boolean
              description: |-
                アクセストークンの有効状態
                - true : トークンは有効

            token_info:
              type: object
              description: |-
                アクセストークンの詳細情報
                - トークンが有効な場合に返却される詳細情報オブジェクト
              required:
              - exp
              - iat
              - scope
              - client_id
              - token_type

              properties:
                exp:
                  type: integer
                  description: |-
                    アクセストークンの有効期限
                    - トークンの有効期限を示すUNIXタイムスタンプが返却されます。
                  example: 1700000000

                iat:
                  type: integer
                  description: |-
                    アクセストークンの発行時刻
                    - トークンの発行時刻を示すUNIXタイムスタンプが返却されます。
                  example: 1700000000

                operator_id:
                  type: string
                  format: uuid
                  minLength: 36
                  maxLength: 36
                  description: |-
                    事業者識別子（内部）
                    - トークンに紐づく事業者の識別子（内部） が返却されます。
                    - ユーザ当人認証（認可コードまたはリソースオーナーパスワードクレデンシャルフロー）APIによって取得したアクセストークンを用いた場合、返却されます。
                    - クライアントシステム認証APIによって取得したアクセストークンを用いた場合、返却されません。
                  example: "d9a38406-cae2-4679-b052-15a75f5531e6"

                open_system_id:
                  type: string
                  description: |-
                    公開システム識別子
                    - トークンに紐づく公開システム識別子が返却されます。
                    - ユーザ当人認証（認可コードまたはリソースオーナーパスワードクレデンシャルフロー）APIによって取得したアクセストークンを用いた場合、返却されません。
                    - クライアントシステム認証APIによって取得したアクセストークンを用いた場合、返却されます。
                    - 設定値は現在未定。今後正式に決定する予定です。

                scope:
                  type: string
                  description: |-
                    クライアントスコープ
                    - 認可コード取得時に許可されたスコープが返却されます。
                  example: "openid scope1 scope2"

                client_id:
                  type: string
                  description: |-
                    クライアントID
                    - トークンに紐づくクライアントIDが返却されます。
                  example: "abc123xyz"

                token_type:
                  type: string
                  description: |-
                    トークンのタイプ
                    - 通常は "Bearer" が返却されます。
                  example: "Bearer"

        # アクセストークンが無効な場合のデータオブジェクト
        # active=false
        - title: inactiveTokenIntrospectionProperties
          type: object
          required:
          - active
          - token_info
          description: |-
            アクセストークンが無効な場合のデータオブジェクト
            - トークンが無効な場合、空のオブジェクトを返却します。
          properties:
            active:
              const: false
              type: boolean
              description: |-
                アクセストークンの有効状態
                - false : トークンは無効

            token_info:
              type: object
              description: |-
                トークンが無効な場合に返却される空のオブジェクト
              properties: {}