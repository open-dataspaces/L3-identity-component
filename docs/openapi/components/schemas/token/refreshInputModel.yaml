refreshInputModel:
  type: object
  description: |-
    アクセストークン更新API
    の Request Body
  title: refreshInputModel
  required:
  - client_id
  - client_secret
  - refresh_token
  properties:
    client_id:
      type: string
      pattern: '^[A-Za-z0-9_-]+$'
      minLength: 1
      maxLength: 239
      description: |
        クライアントID
        - 認証認可を行うIDPのクライアントIDを指定します。
        - IDPに登録されているクライアントアプリケーションを識別するための一意の文字列です。
      example: "abc123xyz"

    client_secret:
      type: string
      minLength: 1
      maxLength: 255
      description: |
        クライアントシークレット
        - クライアントIDに対応するクライアントシークレットを指定します。
        - クライアントIDをIDPに登録した際に発行される秘密鍵です。
      example: "abc123xyz"

    refresh_token:
      type: string
      description: |
        リフレッシュトークン
        - アクセストークンを再取得するためのリフレッシュトークンを指定します。
      example: "eyJraWQiOiJrZXkiLCJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."

