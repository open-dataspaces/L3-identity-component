clientUpdateInputModel:
  type: object
  description: |
    ## 概要
    クライアント情報を更新します。 

  title: clientUpdateInputModel
  required:
  - flow_type
  
  properties:
    flow_type:
      type: string
      enum:
        - client_credentials
      description: |
        更新するクライアントの認証方式
        - client_credentials: クライアントクレデンシャル認証
      example: "client_credentials"
    
    name:
      type: string
      minLength: 0
      maxLength: 255
      description: |
        クライアント名
        - クライアントアプリケーションの名前を指定します。
      example: "My Client System"

    description:
      type: string
      minLength: 0
      maxLength: 255
      description: |
        クライアント説明
        - クライアントアプリケーションの説明を指定します。
      example: "This is my client system for accessing the API."

    operator_id:
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      description: |-
        事業者識別子（内部）
        - 事業者を一意に識別するための識別子です。
      example: "d9a38406-cae2-4679-b052-15a75f5531e6"
    
    open_system_id:
      type: string
      minLength: 1
      maxLength: 255
      description: |
        オープンシステムID
        - 認証フロー変更時は必須項目となります。
        - クライアントシステムを識別するための一意の文字列です。
      example: "system_001"