tokenInputModel:
  type: object
  description: |-
    ユーザ当人認証(認可コードフロー)_トークン取得API
    の Request Body
  title: tokenInputModel
  required:
  - code
  - client_id
  - client_secret
  - redirect_uri
  - code_verifier
  properties:
    code:
      type: string
      description: |
        認可コード
        - ユーザ当人認証(認可コードフロー)_ログインURL取得APIにて取得したURLからログインを行い、リダイレクトURIに遷移した際に付与される認可コード(code)を指定します。
      example: 2c0d0237-9dc1-41da-86f3-d023ae599321.dc903c2f-9042-4940-869e-c0d753107b7f.0c395f1b-8931-467f-bf6a-db561be9742f

    client_id:
      type: string
      pattern: '^[A-Za-z0-9_-]+$'
      minLength: 1
      maxLength: 239
      description: |
        クライアントID
        - 認証認可を行うIDPのクライアントIDを指定します。
        - IDPに登録されているクライアントアプリケーションを識別するための一意の文字列です。
      example: "abc123xyz"

    client_secret:
      type: string
      minLength: 1
      maxLength: 255
      description: |
        クライアントシークレット
        - クライアントIDに対応するクライアントシークレットを指定します。
        - クライアントIDをIDPに登録した際に発行される秘密鍵です。
      example: "abc123xyz"

    redirect_uri:
      type: string
      pattern: '^[^*%{}\\\s\p{Zs}\p{Cc}]+$'
      minLength: 1
      maxLength: 255
      description: |
        リダイレクトURI
        - 認可コード取得時に指定したリダイレクトURIを指定します。
        - 認可コード取得時と異なる場合、アクセストークンは取得できません。
      example: "https://example.com/home"

    code_verifier:
      type: string
      description: |
        PKCE用コード検証文字列
        - 認可コード取得時に指定したPKCE用のコードチャレンジ文字列を指定します。
        - 詳細は "ユーザ当人認証(認可コードフロー)_ログインURL取得API" の仕様を確認してください。
      example: "IevIR0cQsAuNuPha71dAbjkT-sipaqXEquPhtCqKL80"

