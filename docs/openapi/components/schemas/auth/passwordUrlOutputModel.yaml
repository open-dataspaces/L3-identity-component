# パスワード変更画面URL情報モデル
# ------------------------------------------
passwordUrlOutputModel:
  type: object
  required:
  - data
  properties:
    data:
      $ref: "#/passwordUrlProperties"

# パスワード変更画面URLプロパティ
# ------------------------------------------
passwordUrlProperties:
  type: object
  description: |-
    APIの実行結果のデータオブジェクト
  required:
    - url
  properties:
    url:
      type: string
      description: |-
        IDPのパスワード変更画面URL  
        - リクエストパラメタに基づいたパスワード変更画面のURLを返却します。
      example: "https://open-dataspaces org/realms/myrealm/protocol/openid-connect/auth?client_id=myclient&response_type=code&scope=openid&redirect_uri=https%3A%2F%2Fmyapp.com%2Fhome&kc_action=UPDATE_PASSWORD&code_challenge=IevIR0cQsAuNuPha71dAbjkT-sipaqXEquPhtCqKL80&code_challenge_method=S256&prompt=login"

