passwordInputModel:
  type: object
  description: |-
    パスワード変更API
    の Request Body
  title: passwordInputModel
  required:
  - old_password
  - new_password
  properties:

    old_password:
      type: string
      example: xx@&1234Pass
      minLength: 0
      maxLength: 20
      pattern: '^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[!@#$%^&*()])[A-Za-z0-9!@#$%^&*()]+$'
      description: |
        変更前のパスワード  
        - 現在のパスワードを指定します。  
          - パスワード未登録の事業者に対して、パスワードを新規登録する場合  
            空文字を指定してください。
        - 現在のパスワードと一致しない場合、パスワード変更を拒否します。

    new_password:
      type: string
      example: xx@&1234Pass
      minLength: 8
      maxLength: 20
      pattern: '^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[!@#$%^&*()])[A-Za-z0-9!@#$%^&*()]+$'
      description: |
        変更後のパスワード  
        - 新しいパスワードを指定します。  
        - 以下の文字を1文字以上含む必要があり、使用可能な文字は英数字および指定された記号のみです。
          - 半角英大文字
          - 半角英小文字
          - 数字
          - !@#$%^&*()のいずれかの記号
        - パスワードポリシーに従っていない場合、パスワード変更を拒否します。
