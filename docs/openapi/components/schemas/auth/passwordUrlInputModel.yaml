passwordUrlInputModel:
  type: object
  description: |-
    パスワード変更画面URL取得API
    の Request Body
  title: passwordUrlInputModel
  required:
    - client_id
    - redirect_uri
    - code_challenge
  properties:
    client_id:
      type: string
      pattern: '^[A-Za-z0-9_-]+$'
      minLength: 1
      maxLength: 239
      description: |
        クライアントID
        - 認証認可を行うIDPのクライアントIDを指定します。
        - IDPに登録されているクライアントアプリケーションを識別するための一意の文字列です。
      example: "abc123xyz"

    redirect_uri:
      type: string
      pattern: '^[^*%{}\\\s\p{Zs}\p{Cc}]+$'
      minLength: 1
      maxLength: 255
      description: |
        リダイレクトURI  
        - パスワード変更後に遷移するアプリケーションのURIを指定します。事前に登録したURIのみ遷移が可能です。
        - パスワード変更画面URL取得APIではパスワード入力画面のみの提供となり、成否に関わらず、指定したリダイレクトURIに遷移します。
      example: https://example.com/home

    code_challenge:
      type: string
      description: |
        PKCE用コードチャレンジ  
        - 認可リクエストで使用するPKCE用のチャレンジ文字列を指定します。  
          チャレンジ方式はS256で、以下手順でコードを生成します。
        1. code_verifier を生成（ランダムな文字列）
          - 長さ：43〜128文字（RFC 7636で定義）
          - 文字種：英数字（A-Z, a-z, 0-9）と -, ., _, ~ のみ（URLセーフな文字）
        2. code_verifier を SHA256 でハッシュ
        3. ハッシュ値を Base64URL エンコード
        - code_verifierはトークン取得APIのリクエスト時にも必要になる値です。
      example: "IevIR0cQsAuNuPha71dAbjkT-sipaqXEquPhtCqKL80"