tokenPasswordInputModel:
  type: object
  description: |
    ユーザ当人認証（リソースオーナーパスワードクレデンシャルフロー）API
    の Request Body
  title: tokenPasswordInputModel
  required:
    - client_id
    - client_secret
    - login_user_id
    - password
  properties:
    client_id:
      type: string
      pattern: '^[A-Za-z0-9_-]+$'
      minLength: 1
      maxLength: 239
      description: |
        クライアントID
        - 認証認可を行うIDPのクライアントIDを指定します。
        - IDPに登録されているクライアントアプリケーションを識別するための一意の文字列です。
      example: "abc123xyz"

    client_secret:
      type: string
      minLength: 1
      maxLength: 255
      description: |
        クライアントシークレット
        - クライアントIDに対応するクライアントシークレットを指定します。
        - クライアントIDをIDPに登録した際に発行される秘密鍵です。
      example: "abc123xyz"

    login_user_id:
      type: string
      pattern: '^[a-z0-9_.-@]+$'
      minLength: 3
      maxLength: 255
      description: |-
        ログインユーザID
        - ログインに使用するIDです。
      example: "login_user_id_12345"

    password:
      type: string
      minLength: 8
      maxLength: 20
      pattern: '^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[!@#$%^&*()])[A-Za-z0-9!@#$%^&*()]+$'
      description: |-
        ログインユーザIDのパスワード
        - ログインユーザIDに紐づく事業者のパスワードを指定します。
      example: xx@&&1234Pass

