openapi: "3.0.3"
info:
  title: |-
    OPEN-DATA-SPACES  
    認証認可システム  
    API Docs
  version: 1.0.0
  description: |
    ## 概要
    本APIは、認証および事業者・属性情報を扱うためのエンドポイント群を提供します。  
    全てのエンドポイントは CORS（Cross-Origin Resource Sharing）に対応しています。  
    ※許可されるオリジンは、事前に登録された信頼済みのドメインに限定されます。

    ## 変更履歴管理

    ### ver.1.0.0 2026/03/19 新規作成

servers:
  - url: https://api.example.com/
  # ここは実際のAPIサーバーのURLに置き換えてください
    description: 認証認可システムAPI BaseURL

tags:
  - name: auth
    description: 認証に関するAPI
  - name: auth/token
    description: トークン検証・更新・破棄に関するAPI
  - name: auth/password
    description: パスワード管理に関するAPI
  - name: auth/apikey
    description: API-Keyの検証に関するAPI
  - name: authz
    description: 認可に関するAPI
  - name: auth/clients
    description: クライアントID発行に関するAPI
  - name: account/user
    description: ユーザ管理に関するAPI
  - name: account/operator
    description: 事業者情報管理に関するAPI
  - name: account/operator/plant
    description: 属性（事業所）管理に関するAPI

paths:
  # 認証関連のAPI -----------------------------------
  # ユーザ当人認証(認可コードフロー)_ログインURL取得API
  /auth/url:
    $ref: "./paths/auth/url.yaml"
  # ユーザ当人認証(認可コードフロー)_トークン取得API
  /auth/token:
    $ref: "./paths/auth/token.yaml"
  # 【非推奨】ユーザ当人認証（リソースオーナーパスワードクレデンシャルフロー）API
  /auth/token/password:
    $ref: "./paths/auth/tokenPassword.yaml"
  # クライアントシステム認証API
  /auth/token/client:
    $ref: "./paths/auth/tokenClient.yaml"

  # トークン検証・更新・破棄のAPI -----------------------------------
  # トークン検証API
  /auth/token/introspect:
    $ref: "./paths/token/introspect.yaml"
  # アクセストークン更新API
  /auth/token/refresh:
    $ref: "./paths/token/refresh.yaml"
  # トークン破棄API
  /auth/token/revoke:
    $ref: "./paths/token/revoke.yaml"
  
  # パスワード管理のAPI -----------------------------------
  # パスワード変更画面URL取得API
  /auth/password/url:
    $ref: "./paths/auth/passwordUrl.yaml"
  # パスワード変更API
  /auth/password/{operator_id}:
    $ref: "./paths/auth/password.yaml"

  # APIKey検証のAPI -----------------------------------
  # APIKey検証API
  /auth/apikey/verify:
    $ref: "./paths/apikey/verify.yaml"
    
  # 認可関連のAPI -----------------------------------
  /authz/stores:
    $ref: "./paths/authz/stores.yaml"
  /authz/stores/{store_id}:
    $ref: "./paths/authz/store.yaml"
  /authz/stores/{store_id}/authorization-models:
    $ref: "./paths/authz/authorizationModels.yaml"
  /authz/stores/{store_id}/write:
    $ref: "./paths/authz/write.yaml"
  /authz/stores/{store_id}/read:
    $ref: "./paths/authz/read.yaml"
  /authz/stores/{store_id}/access/v1/evaluation:
    $ref: "./paths/authz/evaluation.yaml"
  /authz/stores/{store_id}/access/v1/evaluations:
    $ref: "./paths/authz/evaluations.yaml"

  # クライアントID関連API -----------------------------------
  # クライアントID関連API
  /auth/clients:
    $ref: "./paths/clients/registration.yaml"
  /auth/clients/{client_id}:
    $ref: "./paths/clients/clientId.yaml"
  # クライアントシークレット取得API
  /auth/clients/secret/{client_uuid}:
    $ref: "./paths/clients/secret.yaml"

  # ユーザ管理のAPI -----------------------------------
  # ユーザ登録API
  /account/user:
    $ref: "./paths/user/user.yaml"

  # 事業者情報管理のAPI -----------------------------------
  # 事業者情報登録API
  /account/operator:
    $ref: "./paths/operator/operator.yaml"
  /account/operator/{operator_id}:
    $ref: "./paths/operator/operatorId.yaml"
  /account/operator/status/{operator_id}:
    $ref: "./paths/operator/operatorStatus.yaml"
  /account/operator/list:
    $ref: "./paths/operator/operatorList.yaml"

  # 属性（事業所）情報管理のAPI -----------------------------------
  # 属性（事業所）情報登録API
  /account/operator/plant:
    $ref: "./paths/plant/plant.yaml"
  /account/operator/plant/{plant_id}:
    $ref: "./paths/plant/plantId.yaml"
  /account/operator/plant/status/{plant_id}:
    $ref: "./paths/plant/plantStatus.yaml"
  /account/operator/plant/list:
    $ref: "./paths/plant/plantList.yaml"

components:

  # セキュリティスキーム -----------------------------------
  securitySchemes:
    API-Key:
      type: apiKey
      name: API-Key
      in: header
      description: システムに払い出されているAPIKey

    Authorization:
      type: http
      scheme: bearer
      description: ユーザ当人認証APIまたはクライアントシステム認証APIで発行したアクセストークン
