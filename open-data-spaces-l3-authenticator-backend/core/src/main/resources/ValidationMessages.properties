# Validation Messages
field.blank = %s: cannot be blank
field.size = %s: the length must be between {min} and {max}
field.pattern = %s: the length or characters are invalid
field.pattern.uuid = %s: invalid UUID format
field.pattern.date = %s: invalid date format, expected pattern {pattern}
field.pattern.boolean = %s: invalid boolean format

# Validation Number
field.required = %s: is required
field.range = %s: the value must be between {min} and {max}
field.range.min = %s: the value must be at least {value}
field.range.max = %s: the value must be at most {value}