events {}

http {
  # logging: add request/response timing and upstream info
  log_format main '$remote_addr:$remote_port - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'host="$host" uri="$request_uri" upstream="$upstream_addr" '
                  'up_status=$upstream_status rt=$request_time ua_rt=$upstream_response_time up_connect=$upstream_connect_time';

  # For Docker: send logs to container stdout/stderr
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  # 8090 to ods-app
  server {
    listen 80;
    server_name app.ods.localhost;

    resolver 127.0.0.11 ipv6=off valid=10s;
    set $ods_app "ods-app:8080";

    location / {
      proxy_pass http://$ods_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # 8091 to keycloak_dev
  server {
    listen 80;
    server_name id.ods.localhost;
  
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $keycloak_dev "keycloak_dev:8080";

    location / {
      proxy_pass http://$keycloak_dev;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # 8080 to openfga_dev
  server {
    listen 80;
    server_name authz.ods.localhost;

    resolver 127.0.0.11 ipv6=off valid=10s;
    set $openfga_dev "openfga_dev:8080";

    location / {
      proxy_pass http://$openfga_dev;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
